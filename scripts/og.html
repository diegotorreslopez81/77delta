<!doctype html>
<html lang="es">

    />
    <style>
      html,
      body {

      }
      .marca svg {
        height: 0.73em;
        width: auto;
        fill: #a7781b;
      }
      h1 {
        margin: 0;
        font-weight: 200;
        font-size: 72px;
        line-height: 1.04;
        letter-spacing: -0.035em;

        font-weight: 700;

      }

        font-size: 18px;

        77<svg viewBox="0 0 752 730" aria-hidden="true"

    </div>
