name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Hasta comprar el dominio. Con dominio: SITE_URL=https://77delta.com, SITE_BASE=/ y public/CNAME.
  SITE_URL: https://diegotorreslopez81.github.io
  SITE_BASE: /77delta

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: pnpm@latest
      - name: Comprueba enlaces internos
        run: node scripts/check-links.mjs "$SITE_BASE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
