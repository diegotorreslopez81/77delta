<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HQ</title>
<link rel="manifest" href="/hq/manifest.webmanifest">
<link rel="apple-touch-icon" href="/hq/apple-touch-icon.png">
<meta name="theme-color" content="#0b1f3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/hq/app/tokens.css">
<link rel="stylesheet" href="/hq/app/hq.css">
</head>
<body>
<header class="cab">
  <button class="btn-icono" id="hamburguesa" aria-label="Menú" aria-expanded="false" aria-controls="menu">☰</button>
  <a class="marca" href="#hoy">HQ</a>
  <div class="buscador" id="buscador">
    <input class="campo" id="busqueda" type="search" placeholder="Buscar número o texto" autocomplete="off" aria-label="Buscar en HQ">
    <div class="resultados" id="resultados" hidden></div>
  </div>
  <a class="contador" id="contador" href="#hoy" hidden></a>
  <span class="semaforo" id="semaforo" hidden aria-label="Cuentas"></span>
  <button class="btn-enlace salir" data-salir>salir</button>
</header>
<div class="cuerpo">
  <aside class="menu" id="menu">
    <nav id="nav" aria-label="Áreas"></nav>
    <div class="menu-pie">
      <button class="btn-enlace" id="plegar" aria-label="Plegar o desplegar el menú">plegar</button>
      <a href="/hq/v1/">v1 (hasta 30-sep)</a>
      <button class="btn-enlace" data-salir>salir</button>
      <span class="ver" id="ver"></span>
    </div>
  </aside>
  <div class="velo" id="velo"></div>
  <main id="vista" class="vista"><p class="cargando">Cargando HQ...</p></main>
</div>
<div id="capa"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>var HQ_VERSION = { v: '2.0.3', fecha: '2026-09-17 11:52' }; // la actualiza scripts/hq/version.sh en cada publicación</script>
<script type="module" src="/hq/app/main.js"></script>
</body>
</html>
