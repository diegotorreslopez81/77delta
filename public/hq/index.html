<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HQ · 77 Delta</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06101F">
<link rel="manifest" href="/hq/manifest.webmanifest">
<link rel="icon" href="/hq/icon-192.png">
<link rel="apple-touch-icon" href="/hq/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --papel:#F3EEE4; --panel:#FAF7F0; --panel-2:#F0EADF;
  --tinta:#0A1628; --tinta-2:#26354D; --pizarra:#5C6879; --pizarra-tenue:#9AA3B0;
  --linea:#E0D9CB; --linea-fuerte:#CFC6B5;
  --marino:#06101F; --marfil:#EDEAE3; --pizarra-clara:#AEB8C6;
  --oro:#A7781B; --oro-oscuro:#8A6216; --oro-luz:#D4A03A; --oro-suave:rgba(167,120,27,.12);
  --error:#A8392C; --error-suave:#F7E7E4; --exito:#3F6B4A; --exito-suave:#E7EFE7;
  --display:'Sora',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --radio:14px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --papel:#06101F; --panel:#0C1A30; --panel-2:#122238;
    --tinta:#EDEAE3; --tinta-2:#D5D9DF; --pizarra:#AEB8C6; --pizarra-tenue:#8794A6;
    --linea:#1E2B3B; --linea-fuerte:#2C3B52;
    --oro:#D4A03A; --oro-oscuro:#E2B65A; --oro-suave:rgba(212,160,58,.14);
    --error:#E08678; --error-suave:#2E1D1A; --exito:#8CB897; --exito-suave:#1D2A20; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px !important}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;overflow-x:hidden;max-width:100vw}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro-oscuro)}
.peq{font-size:13px;color:var(--pizarra-tenue)}

/* Cabecera */
header{background:var(--marino);color:var(--marfil);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;top:0;z-index:20;height:calc(56px + env(safe-area-inset-top));box-sizing:border-box}
.monograma{font-family:var(--display);font-weight:700;letter-spacing:-.055em;font-size:22px;display:inline-flex;align-items:baseline;gap:1px}
.monograma b{color:#A7781B;font-weight:700}
header .hq{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--pizarra-clara);margin-left:2px}
header .esp{flex:1}
.pill{background:#A7781B;color:#EDEAE3;font:600 13px var(--mono);padding:4px 10px;border-radius:99px;min-width:32px;text-align:center}
.pill.cero{background:transparent;border:1px solid #2C3B52;color:var(--pizarra-clara)}
.icono{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--marfil);font-size:18px}
.icono:active{background:#122238}
nav.tabs{display:flex;background:var(--marino);position:fixed;left:0;right:0;top:calc(56px + env(safe-area-inset-top));z-index:19;border-bottom:1px solid #1E2B3B;overflow:hidden;height:44px}
nav.tabs button{flex:1 1 0;min-width:0;padding:12px 0 11px;color:var(--pizarra-clara);font:500 12.5px var(--body);border-bottom:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button.on{color:#EDEAE3;border-bottom-color:#A7781B}
nav.tabs button small{font-family:var(--mono);font-size:10px;color:#D4A03A;margin-left:3px}

main{padding:calc(114px + env(safe-area-inset-top)) 14px 0;max-width:720px;margin:0 auto;overflow-x:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--linea-fuerte);font-size:13px;color:var(--pizarra)}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip small{font-family:var(--mono);opacity:.8;margin-left:4px}

/* Avatares y etiquetas */
.avw{position:relative;flex:0 0 auto}
.av{width:52px;height:52px;border-radius:50%;background:var(--panel-2);border:2px solid var(--linea);display:block;object-fit:cover}
.av.peq{width:38px;height:38px}
.av.grande{width:88px;height:88px;margin:0 auto 10px}
.av.logo{border-radius:22%;border:0;background:transparent}
.punto{width:12px;height:12px;border-radius:99px;border:2px solid var(--panel);background:var(--pizarra-tenue);position:absolute;right:-1px;bottom:-1px}
.punto.vivo{background:var(--exito)} .punto.tibio{background:var(--oro-luz)} .punto.off{background:var(--pizarra-tenue)} .punto.nada{background:transparent;border-color:var(--pizarra-tenue)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.dato{font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:8px;background:var(--panel-2);color:var(--tinta-2);white-space:nowrap}
.dato.oro{background:var(--oro-suave);color:var(--oro-oscuro)}
.dato.rojo{background:var(--error-suave);color:var(--error)}
.dato.verde{background:var(--exito-suave);color:var(--exito)}
.dato.tinta{background:var(--tinta);color:var(--papel)}
.dato a{text-decoration:none;font-weight:500}
.tipo-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--oro-suave);font-size:18px;flex:0 0 auto}
.tipo-ic.eur{width:auto;padding:0 10px;font:600 14px var(--mono);color:var(--oro-oscuro);white-space:nowrap}

/* Tarjetas de la bandeja */
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;margin-bottom:12px;position:relative;touch-action:pan-y;transition:transform .25s var(--ease),opacity .25s;will-change:transform}
.card.urgente{border-color:var(--error)}
.card.pronto{border-color:var(--oro)}
.card.marcada{box-shadow:0 0 0 3px var(--oro-suave), 0 0 0 1px var(--oro)}
.card .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card .cab .quien{flex:1;min-width:0}
.card .cab .quien b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cab .quien span{display:block;font-family:var(--mono);font-size:11px;color:var(--pizarra);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3{font-size:18px;margin:2px 0 8px}
.card .det{color:var(--tinta-2);font-size:15px;white-space:pre-wrap;line-height:1.5}
.card .det.largo{overflow:hidden;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical}
.card .det.largo.abierto{display:block}
.card .datos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.acciones{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;border-radius:12px;font:600 15px var(--body);border:1px solid transparent;transition:transform .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.si{background:var(--oro);color:#EDEAE3}
.btn.no{background:transparent;color:var(--tinta);border-color:var(--linea-fuerte)}
.btn.sec{background:var(--panel-2);color:var(--tinta)}
.btn.peq{flex:0 0 auto;padding:9px 12px;font-size:13px}
.nota{margin-top:10px;display:flex;gap:8px;align-items:flex-end}
.nota textarea{flex:1;font:16px var(--body);color:var(--tinta);background:var(--papel);border:1px solid var(--linea-fuerte);border-radius:10px;padding:10px 12px;min-height:44px;resize:vertical}
.nota textarea:focus{outline:2px solid var(--oro);outline-offset:1px}
.mic{width:44px;height:44px;border-radius:10px;border:1px solid var(--linea-fuerte);display:grid;place-items:center;font-size:18px;color:var(--pizarra);flex:0 0 auto}
.enviar{width:44px;height:44px;border-radius:10px;background:var(--oro);color:#EDEAE3;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.hilo{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.burbuja{max-width:88%;padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.45}
.burbuja.diego{align-self:flex-end;background:var(--tinta);color:var(--papel);border-bottom-right-radius:4px}
.burbuja.agente{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.burbuja small{display:block;font-family:var(--mono);font-size:10px;opacity:.7;margin-top:3px}
.mic.rec{background:var(--error-suave);border-color:var(--error);color:var(--error)}
.pista{position:absolute;inset:0;border-radius:var(--radio);display:grid;place-items:center;font:700 14px var(--mono);letter-spacing:.12em;opacity:0;pointer-events:none;transition:opacity .15s}
.pista.si{background:var(--exito-suave);color:var(--exito)} .pista.no{background:var(--error-suave);color:var(--error)}
.vacio{text-align:center;padding:44px 16px;color:var(--pizarra)}
.vacio .delta{font-family:var(--display);font-size:44px;color:var(--oro);font-weight:700;line-height:1}
h2.sec-t{font-size:14px;font-family:var(--mono);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--pizarra);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec-t small{color:var(--oro-oscuro)}
.fila{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.fila .txt{flex:1;min-width:0} .fila .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .m{font-size:12px;color:var(--pizarra);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;margin-top:6px}
.prog .m{flex:1;height:6px;border-radius:99px;background:var(--linea);overflow:hidden}
.prog .m i{display:block;height:100%;background:var(--oro);border-radius:99px}
.prog .m i.ok{background:var(--exito)}
.prog span{font-family:var(--mono);font-size:11px;color:var(--pizarra);white-space:nowrap}
.estado{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--pizarra);white-space:nowrap}
.estado.aprobada,.estado.respondida{background:var(--oro-suave);color:var(--oro-oscuro)}
.estado.ejecutada{background:var(--exito-suave);color:var(--exito)}
.estado.rechazada,.estado.fallida,.estado.caducada,.estado.retirada{background:var(--error-suave);color:var(--error)}

/* Equipo */
.ag{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.ag.owner{background:var(--marino);color:var(--marfil);border-color:var(--marino)}
.ag.owner .rol{color:var(--pizarra-clara)} .ag.owner .dato{background:#122238;color:var(--pizarra-clara)} .ag.owner .dato.oro{color:#D4A03A}
.ag.off{opacity:.6}
.ag .txt{flex:1;min-width:0}
.ag .num{font-family:var(--mono);font-size:11px;color:var(--pizarra-tenue);margin-right:6px}
.ag .n{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.ag .rol{font-size:13px;color:var(--pizarra);margin-top:1px}
.ag .rol code{font-family:var(--mono);font-size:11px;color:var(--pizarra-tenue)}
.sw{position:relative;width:44px;height:26px;flex:0 0 auto;margin-top:4px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--linea-fuerte);border-radius:99px;transition:background .2s}
.sw span::after{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:99px;transition:transform .2s var(--ease)}
.sw input:checked + span{background:var(--oro)}
.sw input:checked + span::after{transform:translateX(18px)}
.org{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px;scrollbar-width:thin}
.org-lienzo{position:relative}
.org-lineas{position:absolute;left:0;top:0}
.org-lineas line{stroke:var(--linea-fuerte);stroke-width:2}
.org-nodo{position:absolute;width:148px;height:96px;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;box-sizing:border-box;cursor:pointer}
.org-nodo .avw{margin-bottom:2px} .org-nodo .av.peq{width:30px;height:30px} .org-nodo .punto{width:10px;height:10px}
.org-nodo b{font-size:13px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.org-nodo span{font-size:10.5px;color:var(--pizarra);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.org-nodo em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--oro-oscuro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.org-nodo.owner{background:var(--marino);color:var(--marfil);border-color:var(--marino)} .org-nodo.owner span{color:var(--pizarra-clara)}
.org-nodo.etiqueta{justify-content:center;border-style:dashed;background:transparent} .org-nodo.etiqueta b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pizarra)}
.org-nodo.off{opacity:.5;border-style:dashed}
.subtabs{display:flex;margin:-4px -14px 12px;border-bottom:1px solid var(--linea);background:var(--papel)}
.subtabs button{flex:1;padding:11px 0;font:500 14px var(--body);color:var(--pizarra);border-bottom:2px solid transparent}
.subtabs button.on{color:var(--tinta);border-bottom-color:var(--oro)}
.depto{margin:6px 0 4px}
.depto .sang{margin-left:14px;border-left:2px solid var(--linea);padding-left:10px}
.hoja{position:fixed;inset:0;background:rgba(6,16,31,.55);z-index:40;display:none;align-items:flex-end}
.hoja.on{display:flex}
.hoja .cuerpo{background:var(--papel);width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.hoja .asa{width:40px;height:4px;border-radius:99px;background:var(--linea-fuerte);margin:0 auto 14px;padding:0}
.hoja .cerrar{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:99px;background:var(--panel-2);color:var(--tinta);font-size:16px;display:grid;place-items:center}
.hoja .cuerpo{position:relative}
.hoja .centro{text-align:center}
.hoja dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:14px}
.hoja dt{color:var(--pizarra);font-family:var(--mono);font-size:12px;padding-top:2px}
.hoja dd{margin:0;white-space:pre-wrap}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px}
.act .cuando{font-family:var(--mono);font-size:11px;color:var(--pizarra-tenue);flex:0 0 64px;padding-top:3px}
.act .que{flex:1;min-width:0}
.act .que small{display:block;font-family:var(--mono);font-size:11px;color:var(--pizarra)}

/* Costes */
.kpi{background:var(--marino);color:var(--marfil);border-radius:var(--radio);padding:18px;margin-bottom:12px}
.kpi .eyebrow{color:var(--oro-luz)}
.kpi .cifra{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:4px 0 6px}
.kpi .cifra small{font-size:16px;color:var(--oro-luz);font-weight:500;margin-left:6px}
.kpi .sub{color:var(--pizarra-clara);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px}
.kpi.cap .medidor{height:10px;border-radius:99px;background:#1E2B3B;overflow:hidden;margin:6px 0 10px}
.kpi.cap .medidor i{display:block;height:100%;border-radius:99px;background:var(--oro-luz)}
.kpi.cap .medidor i.verde{background:#8CB897} .kpi.cap .medidor i.rojo{background:#E08678}
.kpi.cap .frase{margin:10px 0 0;font-size:15px;line-height:1.45;color:#EDEAE3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.mini .v{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.mini .l{font-size:12px;color:var(--pizarra);font-family:var(--mono)}
.mini .v small{font-size:12px;color:var(--pizarra);font-weight:400;font-family:var(--mono);letter-spacing:0}
.mini.plan .v{color:var(--oro-oscuro)}
.mini.alerta{border-color:var(--error)} .mini.alerta .v{color:var(--error)}
.barra{margin-bottom:9px}
.barra .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.barra .l b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .barra .l span{font-family:var(--mono);color:var(--pizarra);white-space:nowrap}
.barra .m{height:8px;border-radius:99px;background:var(--linea);overflow:hidden}
.barra .m i{display:block;height:100%;background:var(--pizarra-tenue);border-radius:99px}
.barra.prio .m i{background:var(--oro)}
.barra.personal .m i{background:var(--linea-fuerte)}
.barra .m i.alerta{background:var(--error)}
.dias{display:flex;align-items:flex-end;gap:3px;height:56px;margin:8px 0 4px}
.dias i{flex:1;background:var(--oro);opacity:.85;border-radius:3px 3px 0 0;min-height:2px}
.dias i.hoy{background:var(--tinta)}
.modelos{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.modelos .dato{font-size:11px;padding:3px 7px}
.plan{margin-bottom:12px}
.plan .cab{display:flex;justify-content:space-between;font-size:13px;color:var(--pizarra);margin-bottom:8px}
.plan .cab b{color:var(--tinta);font-weight:600}
.plan .aviso{font-size:13px;color:var(--oro-oscuro);margin-top:4px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tinta);color:var(--papel);padding:12px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:50;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--oro-luz);font-weight:600}
.menu{position:fixed;right:12px;top:calc(52px + env(safe-area-inset-top));background:var(--panel);color:var(--tinta);border:1px solid var(--linea);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 12px 30px rgba(6,16,31,.2);display:none;z-index:30}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px}
.menu button:active{background:var(--panel-2)}
.menu.resumen{right:56px;left:12px;min-width:0;max-height:70vh;overflow:auto}
.menu.resumen button{display:flex;gap:10px;align-items:center;text-align:left}
.menu.resumen .txt{flex:1;min-width:0} .menu.resumen b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .menu.resumen span{display:block;font-family:var(--mono);font-size:11px;color:var(--pizarra);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{cursor:pointer}
.msg{padding:40px 20px;text-align:center;color:var(--pizarra)}
</style>
</head>
<body>
<header>
  <span class="monograma">77<b>Δ</b></span><span class="hq">HQ</span>
  <span class="esp"></span>
  <span id="pend" class="pill cero">0</span>
  <button class="icono" id="btn-menu" aria-label="Menú">⋯</button>
  <div class="menu" id="menu">
    <button data-m="push">🔔 Activar avisos en este móvil</button>
    <button data-m="datos">↻ Actualizar datos</button>
    <button data-m="recargar">⟳ Recargar la app (versión nueva)</button>
    <button data-m="salir">Cerrar sesión</button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-t="bandeja" class="on">Bandeja<small id="n-bandeja"></small></button>
  <button data-t="negocio">Negocio</button>
  <button data-t="licita">Licita<small id="n-licita"></small></button>
  <button data-t="equipo">Equipo</button>
  <button data-t="costes">Costes</button>
</nav>
<main id="app"><div class="msg">Cargando…</div></main>
<div class="hoja" id="hoja"><div class="cuerpo" id="hoja-cuerpo"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var API = 'https://api.77delta.com', CFG = { notify: API };
function conf(){ var c = localStorage.getItem('hq_cfg'); var p = fetch(API + '/hq/config').then(function(r){ return r.json(); }).then(function(j){ if (!j.url || !j.anon) throw new Error('sin configuración'); localStorage.setItem('hq_cfg', JSON.stringify(j)); return j; });
  return c ? Promise.resolve(JSON.parse(c)).then(function(j){ p.catch(function(){}); return j; }) : p; }
var app = document.getElementById('app');
var params = new URLSearchParams(location.search);
/* El token se queda en la URL a propósito: en iOS "Añadir a pantalla de inicio" captura la URL visible y la app instalada tiene su propio almacenamiento. */
if (params.get('t')) localStorage.setItem('hq_t', params.get('t'));
var TOKEN = localStorage.getItem('hq_t');
if (TOKEN && !params.get('t')) { params.set('t', TOKEN); history.replaceState(null, '', location.pathname + '?' + params); }
var marcar = params.get('id') ? Number(params.get('id')) : null;
if (marcar){ params.delete('id'); history.replaceState(null, '', location.pathname + '?' + params); }
if (!TOKEN) {
  var campo = el('input', { type: 'text', placeholder: 'Pega aquí tu enlace de HQ', style: 'width:100%;font:15px var(--body);padding:12px;border:1px solid var(--linea-fuerte);border-radius:10px;background:var(--panel);color:var(--tinta)' });
  app.textContent = '';
  app.appendChild(el('div', { class: 'msg' }, [el('p', { text: 'Este acceso no lleva tu token.' }), campo,
    el('button', { class: 'btn si', style: 'margin-top:10px;width:100%', text: 'Entrar', onclick: function(){ var m = campo.value.match(/[?&]t=([0-9a-f]{20,})/i) || campo.value.match(/^([0-9a-f]{20,})$/i); if (!m) { campo.focus(); return; } localStorage.setItem('hq_t', m[1]); location.replace(location.pathname + '?t=' + m[1]); } })]));
  return;
}
if (!window.supabase) { app.innerHTML = '<div class="msg">No se ha podido cargar la librería de datos. Recarga.</div>'; return; }
var sb = null;
var S = { hq: null, uso: null, tab: 'bandeja', filtro: 'todo', abiertos: {}, hist: false };
var TIPO = { gasto: 'Gasto', contacto: 'Contacto', publicacion: 'Publicación', estrategia: 'Estrategia', duda: 'Duda', accion: 'Acción humana', otro: 'Aprobación' };
var TIPO_IC = { gasto: '€', contacto: '✉', publicacion: '📣', estrategia: '♟', duda: '?', accion: '🙋', otro: '✓' };
var ESTADO = { pendiente: 'Pendiente', aprobada: 'Aprobada', rechazada: 'Rechazada', respondida: 'Respondida', ejecutada: 'Ejecutada', fallida: 'Fallida', caducada: 'Caducada', retirada: 'Retirada por el agente' };
var OWNER_AV = '/hq/icon-192.png';

/* ---- utilidades ---- */
function el(tag, attrs, kids){ var e = document.createElement(tag); if (attrs) for (var k in attrs){ if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
function eur(n){ return n == null ? '' : Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 }) + ' €'; }
function usd(n){ return Number(n || 0).toLocaleString('es-ES', { maximumFractionDigits: n < 10 ? 2 : 0 }) + ' $'; }
function num(n){ return Number(n || 0).toLocaleString('es-ES'); }
function rel(iso){ if (!iso) return ''; var d = (new Date(iso) - Date.now()) / 1000, a = Math.abs(d), s;
  if (a < 3600) s = Math.round(a / 60) + ' min'; else if (a < 86400) s = Math.round(a / 3600) + ' h'; else s = Math.round(a / 86400) + ' d';
  return d < 0 ? 'hace ' + s : 'en ' + s; }
function urgencia(s){ if (!s.vence) return ''; var h = (new Date(s.vence) - Date.now()) / 36e5; return h < 24 ? 'urgente' : h < 72 ? 'pronto' : ''; }
function toast(txt, accion, fn){ var t = document.getElementById('toast'); t.textContent = ''; t.appendChild(document.createTextNode(txt));
  if (accion) t.appendChild(el('button', { text: accion, onclick: function(){ ocultarToast(); fn(); } }));
  t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(ocultarToast, accion ? 6000 : 2500); }
function ocultarToast(){ document.getElementById('toast').classList.remove('on'); }
function rpc(fn, args){ return sb.rpc(fn, args).then(function(r){ if (r.error) throw new Error(r.error.message || 'error'); return r.data; }); }
function agente(id){ return (S.hq.agentes || []).filter(function(a){ return a.id === id; })[0]; }
function persona(a){ var c = (a && a.contrato) || {}; return c.persona || (a ? a.nombre : ''); }
function rolDe(a){ var c = (a && a.contrato) || {}; return c.rol || (a ? a.nombre : ''); }
function avatar(a, cls){ var c = (a && a.contrato) || {}; return el('img', { class: 'av ' + (cls || '') + (c.avatar ? '' : ' logo'), src: c.avatar || OWNER_AV, alt: '' }); }
function familia(m){ m = String(m || '').toLowerCase(); return m.indexOf('fable') >= 0 ? 'fable' : m.indexOf('mythos') >= 0 ? 'mythos' : m.indexOf('opus') >= 0 ? 'opus' : m.indexOf('sonnet') >= 0 ? 'sonnet' : m.indexOf('haiku') >= 0 ? 'haiku' : (m || '?'); }
function nombreModelo(m){ var s = String(m || '').toLowerCase(), mil = s.indexOf('[1m]') >= 0 ? ' · 1M' : '';
  if (!s) return ''; if (/fable-5-1/.test(s)) return 'Fable 5.1' + mil; if (/fable/.test(s)) return 'Fable 5' + mil; if (/mythos-5-1/.test(s)) return 'Mythos 5.1'; if (/mythos/.test(s)) return 'Mythos 5';
  if (/opus-5/.test(s) || /^opus(\[|$)/.test(s)) return 'Opus 5' + mil; if (/opus-4-8/.test(s)) return 'Opus 4.8' + mil; if (/opus-4-7/.test(s)) return 'Opus 4.7' + mil; if (/opus-4-6/.test(s)) return 'Opus 4.6' + mil; if (/opus-4-5/.test(s)) return 'Opus 4.5'; if (/opus/.test(s)) return 'Opus' + mil;
  if (/sonnet-5/.test(s) || /^sonnet(\[|$)/.test(s)) return 'Sonnet 5' + mil; if (/sonnet-4-6/.test(s)) return 'Sonnet 4.6'; if (/sonnet-4-5/.test(s)) return 'Sonnet 4.5'; if (/sonnet/.test(s)) return 'Sonnet';
  if (/haiku-4-5/.test(s) || /^haiku(\[|$)/.test(s)) return 'Haiku 4.5'; if (/haiku/.test(s)) return 'Haiku'; return m; }
function costePorAgente(){ var m = {}; (S.uso.por_agente || []).forEach(function(x){ m[x.agente] = x.coste; }); return m; }
function ultimo(a){ var d = a.ultima_actividad ? new Date(a.ultima_actividad) : null; (S.uso.por_agente || []).forEach(function(x){ if (x.agente === a.id && x.ultimo){ var u = new Date(Math.min(Date.now(), new Date(x.ultimo + 'T12:00:00').getTime())); if (!d || u > d) d = u; } }); if (d && d > Date.now()) d = new Date(); return d; }
function estadoAg(a){ var u = ultimo(a), h = u ? (Date.now() - u) / 36e5 : null; return !a.activo ? 'off' : h == null ? 'nada' : h < 36 ? 'vivo' : h < 24 * 7 ? 'tibio' : 'nada'; }
function prioDepto(d){ var m = 9; S.hq.agentes.forEach(function(a){ if (a.depto === d && a.prioridad < m) m = a.prioridad; }); return m; }
function ordenados(){ var ags = S.hq.agentes.slice(), deptos = []; ags.forEach(function(a){ if (a.nivel > 1 && deptos.indexOf(a.depto) < 0) deptos.push(a.depto); });
  deptos.sort(function(x, y){ return prioDepto(x) - prioDepto(y) || x.localeCompare(y); });
  var out = ags.filter(function(a){ return a.nivel === 1; }); deptos.forEach(function(d){ out = out.concat(ags.filter(function(a){ return a.depto === d && a.nivel === 2; }), ags.filter(function(a){ return a.depto === d && a.nivel === 3; })); });
  out.forEach(function(a, i){ a._n = i + 1; }); return { lista: out, deptos: deptos }; }

/* ---- carga ---- */
var cargando = false;
function cargar(){ if (cargando) return Promise.resolve(); cargando = true;
  return Promise.all([rpc('omc_hq', { p_token: TOKEN }), rpc('omc_hq_uso', { p_token: TOKEN })]).then(function(r){ S.hq = r[0]; S.uso = r[1]; ordenados(); render(); })
    .catch(function(e){ if (!S.hq) app.innerHTML = '<div class="msg">' + (/token/i.test(e.message) ? 'Este enlace ya no es válido.' : 'No se ha podido cargar: ' + e.message) + '</div>'; else toast('Sin conexión: ' + e.message); })
    .then(function(){ cargando = false; }); }

/* ---- render ---- */
function render(){ var p = S.hq.pendientes.length, pill = document.getElementById('pend'); pill.textContent = p; pill.className = 'pill' + (p ? '' : ' cero');
  document.getElementById('n-bandeja').textContent = p ? p : '';
  var nl = licPorDecidir().length; document.getElementById('n-licita').textContent = nl ? nl : '';
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === S.tab); });
  app.textContent = '';
  if (S.tab === 'bandeja') renderBandeja(); else if (S.tab === 'negocio') renderNegocio(); else if (S.tab === 'licita') renderLicita(); else if (S.tab === 'equipo') renderEquipo(); else renderCostes(); }

/* ---- bandeja ---- */
function renderBandeja(){
  var pend = S.hq.pendientes, deptos = {};
  pend.forEach(function(s){ deptos[s.depto || 'Otros'] = (deptos[s.depto || 'Otros'] || 0) + 1; });
  var chips = el('div', { class: 'chips' });
  var lista = [['todo', 'Todo', pend.length]].concat(Object.keys(deptos).sort(function(a, b){ return prioDepto(a) - prioDepto(b); }).map(function(d){ return [d, d, deptos[d]]; }));
  var dudas = pend.filter(function(s){ return s.tipo === 'duda'; }).length; if (dudas) lista.push(['duda', 'Dudas', dudas]);
  lista.forEach(function(c){ chips.appendChild(el('button', { class: 'chip' + (S.filtro === c[0] ? ' on' : ''), onclick: function(){ S.filtro = c[0]; render(); } }, [c[1], el('small', { text: c[2] })])); });
  app.appendChild(chips);
  var vis = pend.filter(function(s){ return S.filtro === 'todo' || (S.filtro === 'duda' ? s.tipo === 'duda' : (s.depto || 'Otros') === S.filtro); });
  if (!vis.length) app.appendChild(el('div', { class: 'vacio' }, [el('div', { class: 'delta', text: 'Δ' }), el('p', { text: pend.length ? 'Nada en este filtro.' : 'Bandeja vacía. Los agentes trabajan.' })]));
  vis.forEach(function(s){ app.appendChild(tarjeta(s)); });
  if ((S.hq.pospuestas || []).length){ app.appendChild(el('h2', { class: 'sec-t' }, ['Pospuestas ', el('small', { text: S.hq.pospuestas.length })]));
    S.hq.pospuestas.forEach(function(s){ var f = filaHist(s); f.querySelector('.estado').textContent = 'vuelve ' + rel(s.pospuesta_hasta); app.appendChild(f); }); }
  if (S.hq.seguimiento.length){ app.appendChild(el('h2', { class: 'sec-t' }, ['En ejecución ', el('small', { text: S.hq.seguimiento.length })]));
    S.hq.seguimiento.forEach(function(s){ app.appendChild(filaHist(s)); }); }
  var h = el('h2', { class: 'sec-t', onclick: function(){ S.hist = !S.hist; render(); } }, [(S.hist ? '▾ ' : '▸ ') + 'Historial ', el('small', { text: S.hq.historial.length })]);
  app.appendChild(h);
  if (S.hist) S.hq.historial.forEach(function(s){ app.appendChild(filaHist(s)); });
  if (marcar){ var c = document.getElementById('s-' + marcar); if (c){ c.classList.add('marcada'); c.scrollIntoView({ block: 'center' }); } else { var s = S.hq.seguimiento.concat(S.hq.historial).filter(function(x){ return x.id === marcar; })[0]; if (s) hojaSolicitud(s); } marcar = null; }
}

function licDe(s){ var txt = (s.titulo + ' ' + s.detalle).toLowerCase(); return licTodas().filter(function(l){ return l.expediente && l.expediente.length > 4 && txt.indexOf(l.expediente.toLowerCase()) >= 0; })[0]; }
function tarjeta(s){
  var esDuda = s.tipo === 'duda', u = urgencia(s), ag = agente(s.agente), lic = s.importe == null ? licDe(s) : null;
  var card = el('div', { class: 'card ' + u, id: 's-' + s.id });
  card.appendChild(el('div', { class: 'cab' }, [el('div', { class: 'avw' }, [avatar(ag, 'peq')]),
    el('div', { class: 'quien' }, [el('b', { text: ag ? persona(ag) + ' · ' + rolDe(ag) : s.agente }), el('span', { text: (s.depto || '') + ' · ' + (TIPO[s.tipo] || s.tipo) + ' · #' + s.id + ' · ' + rel(s.created_at) })]),
    (s.importe != null || (lic && lic.importe != null)) ? el('div', { class: 'tipo-ic eur', text: eur(s.importe != null ? s.importe : lic.importe) }) : el('div', { class: 'tipo-ic', text: TIPO_IC[s.tipo] || '✓', title: TIPO[s.tipo] || s.tipo })]));
  card.appendChild(el('h3', { text: s.titulo }));
  if (s.detalle){ var largo = s.detalle.length > 700, det = el('div', { class: 'det' + (largo ? ' largo' : '') + (S.abiertos[s.id] ? ' abierto' : ''), text: s.detalle });
    if (largo) det.addEventListener('click', function(){ S.abiertos[s.id] = !S.abiertos[s.id]; det.classList.toggle('abierto'); }); card.appendChild(det); }
  var datos = el('div', { class: 'datos' });
  if (s.importe != null) datos.appendChild(el('span', { class: 'dato oro', text: eur(s.importe) }));
  else if (lic && lic.importe != null) datos.appendChild(el('span', { class: 'dato oro', text: 'licitación ' + eur(lic.importe) + (lic.organo ? ' · ' + lic.organo.slice(0, 40) : '') }));
  if (s.vence) datos.appendChild(el('span', { class: 'dato ' + (u === 'urgente' ? 'rojo' : u === 'pronto' ? 'oro' : ''), text: (new Date(s.vence) < Date.now() ? 'vencida ' : 'vence ') + rel(s.vence) + ' · ' + new Date(s.vence).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) }));
  if (s.riesgo) datos.appendChild(el('span', { class: 'dato', text: s.riesgo }));
  if (s.prioridad === 1) datos.appendChild(el('span', { class: 'dato oro', text: 'ingresos' }));
  if (/^https?:\/\//.test(s.enlace)) datos.appendChild(el('span', { class: 'dato tinta' }, [el('a', { href: s.enlace, target: '_blank', rel: 'noopener', text: 'Abrir ↗' })]));
  if (datos.children.length) card.appendChild(datos);
  var hilo = (S.hq.hilos || {})[s.id] || [];
  if (hilo.length) card.appendChild(burbujas(hilo, ag));
  var ta = el('textarea', { placeholder: esDuda ? 'Tu respuesta o una pregunta' : (hilo.length ? 'Sigue la conversación' : 'Nota o pregunta para ' + (ag ? persona(ag) : 'el agente')), rows: '1' });
  var mic = el('button', { class: 'mic', 'aria-label': 'Dictar', text: '🎤', onclick: function(){ dictar(ta, mic); } });
  var env = el('button', { class: 'enviar', 'aria-label': 'Enviar comentario', title: 'Enviar sin resolver', text: '➤', onclick: function(){ comentar(s, ta, ag); } });
  var nota = el('div', { class: 'nota', style: (esDuda || hilo.length) ? '' : 'display:none' }, [ta, mic, env]);
  card.appendChild(nota);
  var acc = el('div', { class: 'acciones' });
  if (esDuda){ acc.appendChild(el('button', { class: 'btn peq sec', text: '⏰', 'aria-label': 'Posponer', onclick: function(){ hojaPosponer(s); } })); acc.appendChild(el('button', { class: 'btn si', text: 'Responder y cerrar', onclick: function(){ if (!ta.value.trim()) { ta.focus(); return; } resolver(s, 'respondida', ta.value.trim()); } })); }
  else {
    acc.appendChild(el('button', { class: 'btn peq sec', text: '💬', 'aria-label': 'Conversar', onclick: function(){ nota.style.display = nota.style.display === 'none' ? 'flex' : 'none'; if (nota.style.display !== 'none') ta.focus(); } }));
    acc.appendChild(el('button', { class: 'btn peq sec', text: '⏰', 'aria-label': 'Posponer', onclick: function(){ hojaPosponer(s); } }));
    acc.appendChild(el('button', { class: 'btn no', text: 'Rechazar', onclick: function(){ resolver(s, 'rechazada', ta.value.trim()); } }));
    acc.appendChild(el('button', { class: 'btn si', text: 'Aprobar', onclick: function(){ resolver(s, 'aprobada', ta.value.trim()); } }));
    deslizar(card, function(){ resolver(s, 'aprobada', ta.value.trim()); }, function(){ resolver(s, 'rechazada', ta.value.trim()); });
  }
  card.appendChild(acc);
  return card;
}
function filaHist(s){ var ag = agente(s.agente), n = ((S.hq.hilos || {})[s.id] || []).length;
  return el('div', { class: 'fila', onclick: function(){ hojaSolicitud(s); } }, [avatar(ag, 'peq'),
    el('div', { class: 'txt' }, [el('div', { class: 't', text: s.titulo }), el('div', { class: 'm', text: (ag ? persona(ag) : s.agente) + ' · ' + (TIPO[s.tipo] || s.tipo) + (s.importe != null ? ' · ' + eur(s.importe) : '') + (n ? ' · 💬 ' + n : '') + ' · ' + rel(s.done_at || s.resolved_at || s.created_at) })]),
    el('span', { class: 'estado ' + s.estado, text: ESTADO[s.estado] || s.estado })]); }
function burbujas(hilo, ag){ var box = el('div', { class: 'hilo' });
  hilo.forEach(function(m){ box.appendChild(el('div', { class: 'burbuja ' + (m.autor === 'diego' ? 'diego' : 'agente') }, [m.texto, el('small', { text: (m.autor === 'diego' ? 'Tú' : (ag ? persona(ag) : m.autor)) + ' · ' + rel(m.ts) })])); });
  return box; }
function comentar(s, ta, ag){ var txt = ta.value.trim(); if (!txt){ ta.focus(); return; }
  rpc('omc_comentar', { p_token: TOKEN, p_id: s.id, p_texto: txt }).then(function(){ ta.value = ''; return cargar(); }).then(function(){ toast('Enviado a ' + (ag ? persona(ag) : s.agente)); emitir(); }).catch(function(e){ toast('No se pudo enviar: ' + e.message); }); }

/* ---- acciones ---- */
function resolver(s, estado, respuesta){
  var card = document.getElementById('s-' + s.id); if (card){ card.style.opacity = '0'; card.style.transform = 'translateX(' + (estado === 'rechazada' ? '-' : '') + '110%)'; }
  rpc('omc_resolver', { p_token: TOKEN, p_id: s.id, p_estado: estado, p_respuesta: respuesta || '' }).then(function(){
    return cargar().then(function(){ toast((ESTADO[estado] || estado) + ' #' + s.id, 'Deshacer', function(){ rpc('omc_resolver', { p_token: TOKEN, p_id: s.id, p_estado: 'pendiente', p_respuesta: '' }).then(cargar).catch(function(e){ toast(e.message); }); }); emitir(); });
  }).catch(function(e){ toast('No se pudo: ' + e.message); cargar(); });
}
function toggleAgente(a, activo){ rpc('omc_agente_set', { p_token: TOKEN, p_id: a.id, p_patch: { activo: activo } }).then(cargar).then(function(){ toast(persona(a) + (activo ? ' activado' : ' desactivado')); }).catch(function(e){ toast(e.message); cargar(); }); }

function deslizar(card, si, no){
  /* Solo es un deslizamiento si el gesto es claramente horizontal (más de 28 px y el doble que el vertical). Si empieza vertical, es scroll y se ignora hasta soltar. */
  var x0 = null, y0 = null, dx = 0, modo = null, pista = el('div', { class: 'pista' }); card.appendChild(pista);
  card.addEventListener('pointerdown', function(e){ if (e.target.closest('button,textarea,a,input')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; modo = null; });
  card.addEventListener('pointermove', function(e){ if (x0 == null || modo === 'v') return; var mx = e.clientX - x0, my = e.clientY - y0;
    if (!modo){ if (Math.abs(my) > 10 && Math.abs(my) >= Math.abs(mx)) { modo = 'v'; return; } if (Math.abs(mx) > 28 && Math.abs(mx) > 2 * Math.abs(my)) { modo = 'h'; card.style.transition = 'none'; try { card.setPointerCapture(e.pointerId); } catch (x) {} } else return; }
    dx = mx; card.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 40 + 'deg)';
    pista.className = 'pista ' + (dx > 0 ? 'si' : 'no'); pista.textContent = dx > 0 ? 'APROBAR' : 'RECHAZAR'; pista.style.opacity = Math.min(1, Math.abs(dx) / 110); });
  function fin(){ if (x0 == null) return; var h = modo === 'h'; x0 = null; modo = null; card.style.transition = ''; pista.style.opacity = 0;
    if (h && dx > 110) si(); else if (h && dx < -110) no(); else card.style.transform = ''; dx = 0; }
  card.addEventListener('pointerup', fin); card.addEventListener('pointercancel', fin); card.addEventListener('lostpointercapture', fin);
}
